version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: iem_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: iem_admission_db
      MYSQL_USER: iem_user
      MYSQL_PASSWORD: iem_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema:/docker-entrypoint-initdb.d
    networks:
      - iem_network

  mongo:
    image: mongo:6.0
    container_name: iem_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: iem_documents_db
    volumes:
      - mongo_data:/data/db
    networks:
      - iem_network

volumes:
  mysql_data:
  mongo_data:

networks:
  iem_network:
    driver: bridge
